<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orangey paint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="container">
            <header>
                <div class="window-title">
                    <p style="display: flex; position: relative; top:-1.1em; font-size: 1.3em; left: 1em">paint</p>
                </div>
            </header>
            <section class="tools">
                <ul class="tool-option">
                    <li id="rectangle" class="tool"></li>
                    <li id="triangle" class="tool"></li>
                    <li id="cirle" class="tool"></li>
                   <li id="polygon" class="tool">
                    <input type="checkbox" id="hide">
                    <input type="number" id="sides" min="3" value="5" max="12">
                    <label for="sides" style="display: none;">sides?</label>
                   </li>
                </ul>
                <ul class="fill-box">
                     <li id="fill">
                        <input type="checkbox" id="fill-check">
                        <label for="fill-check">Fill color?</label>
                    </li>
                </ul>
                <ul class="tool-box">
                    <li id="brush"  class="tool"></li>
                    <li id="crayon"  class="tool"></li>
                    <li id="text"  class="tool"></li>
                    <li id="eraser"  class="tool"></li>
                </ul>
                <ul class="size">
                    <input type="range" id="size-range">
                </ul>
                <div class="time" id="timer">30</div>
            </section>
            <section class="screen">
                <canvas id="canvas"></canvas>
            </section>
            <section class="colors">
                <ul class="color-box">
                    <li class="color"></li>
                   <li class="color"></li>
                   <li class="color"></li>
                   <li class="color"></li>
                   <li class="color"></li>
                   <li class="color"></li>
                    <li class="color"></li>
                   <li class="color">
                    <input type="color" id="color-select" value="#c36609"
                   </li>
                </ul>
                <div class="submit-box">
                    <button id="submit">submit</button>
                    <button id="clear">clear</button>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
